{% extends "base.html" %}
{% block title %}题目库 · 问卷工坊{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">可复用的问题</p><h1>题目库</h1><p class="muted">保存常用题目，保留每个版本，让问卷各有依据。</p></div><button type="button" class="btn btn-primary" id="library-create">＋ 创建题目</button></section>
<div id="library-picker-notice" class="alert alert-info" hidden></div>
<div id="library-error" class="alert alert-error" role="alert" hidden></div>
<section class="library-toolbar" aria-label="题库筛选"><div class="library-scopes" role="group" aria-label="题目范围"><button class="btn is-active" data-library-scope="mine">我的题目</button><button class="btn" data-library-scope="bookmarks">我的收藏</button><button class="btn" data-library-scope="shared">共享给我</button><button class="btn" data-library-scope="public">公共题目</button></div><form id="library-search" class="library-search"><input id="library-query" aria-label="搜索题目" maxlength="100" placeholder="搜索标题或内容"><input id="library-tag" aria-label="按个人标签筛选" maxlength="40" placeholder="个人标签"><button class="btn" type="submit">查找</button></form><div class="actions"><button class="btn btn-small" id="library-refresh" type="button">刷新</button><button class="btn btn-small" id="library-rename-tag" type="button">整理标签</button><span class="muted small" id="library-total">正在加载…</span></div></section>
<div class="library-workspace"><aside class="library-list" id="library-list" aria-label="题目列表"><div class="loading-state">正在读取题目…</div></aside><section class="library-detail" id="library-detail" aria-label="题目详情"><div class="library-welcome card"><span class="library-welcome-mark" aria-hidden="true">❐</span><h2>让好问题继续被使用</h2><p class="muted">从左侧选择题目，查看内容、版本、使用情况和跨问卷汇总。</p><p class="hint">题目更新只提供提示，已选用的问卷不会自动变化。</p></div></section></div>
<div id="library-pagination"></div>
<dialog class="modal library-modal" id="library-create-dialog"><form id="library-create-form"><div class="modal-heading"><h2>创建可复用题目</h2><button type="button" class="icon-btn" data-close-dialog="library-create-dialog" aria-label="关闭">×</button></div><p class="muted small">先保存编辑稿，再明确创建正式版本。问卷只选用正式版本。</p><div class="alert alert-error" id="library-create-error" role="alert" hidden></div><div id="library-create-fields"></div><label class="field"><span>可见范围</span><select id="library-create-visibility"><option value="private">私有题目 · 可随后共享</option><option value="public">公共题目 · 仅管理员可创建</option></select></label><div class="modal-actions"><button type="button" class="btn" data-close-dialog="library-create-dialog">取消</button><button type="submit" class="btn btn-primary" id="library-create-submit">保存编辑稿</button></div></form></dialog>
{% endblock %}
{% block scripts %}<script type="module" src="/static/library.js"></script>{% endblock %}
