<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}问卷工坊{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 20h28M18 32h20M18 44h14' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body data-page="{{ page|default('') }}" data-survey-id="{{ survey_id|default('') }}" data-public-id="{{ public_id|default('') }}">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="/dashboard" class="brand" aria-label="问卷工坊首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6h12M6 12h9M6 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>问卷工坊</span></a>
      <nav aria-label="主导航" class="header-nav"><a href="/dashboard" data-auth-only hidden>我的问卷</a><span class="user-name" id="nav-user" hidden></span><button type="button" class="btn btn-quiet btn-small" id="logout" hidden>退出登录</button><a class="btn btn-small" id="nav-login" href="/login" hidden>登录</a></nav>
    </div>
  </header>
  <main id="main" {% block main_attrs %}class="page-container"{% endblock %}>{% block content %}{% endblock %}</main>
  <footer class="site-footer">问卷工坊 <span aria-hidden="true">·</span> 让每一份回答都有价值</footer>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <script type="module" src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
