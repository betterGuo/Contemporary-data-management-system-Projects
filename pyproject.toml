[project]
name = "mongodb-survey-lab"
version = "1.0.1"
description = "MongoDB course project: configurable surveys and branching"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pymongo>=4.10,<5",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["case(*ids): experiment acceptance scenario IDs", "integration: requires real MongoDB"]

[tool.ruff]
line-length = 110

